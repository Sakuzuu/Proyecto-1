name: StudyFlow tests
on:
  push:
    branches:
      - main
      - feature/cloud-academic-data
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check auth.js
          node --check academic-data.js
          node --check friends.js
          node --check chess-ui.js
          node --check supabase-config.js
      - name: Install chess rules engine for tests
        run: npm install --no-save --no-package-lock chess.js@1.4.0
      - name: Run automated tests
        run: node --test tests/*.mjs
